<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineList | A Simple Movie Catalog</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #111111;
      font-family: Arial, Inter, Helvetica, sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    a {
      color: #111111;
      text-decoration: none;
    }

    header {
      border-bottom: 1px solid #e5e5e5;
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    nav a {
      font-size: 14px;
      color: #555555;
    }

    nav a:hover {
      color: #111111;
      text-decoration: underline;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    h1 {
      font-size: clamp(34px, 6vw, 52px);
      text-align: center;
      margin: 0 0 8px;
    }

    .subtitle {
      text-align: center;
      margin: 0 0 24px;
      color: #666666;
      font-size: 14px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
    }

    .controls input,
    .controls select {
      font-family: inherit;
      font-size: 14px;
      padding: 9px 12px;
      border: 1px solid #dcdcdc;
      border-radius: 6px;
      background: #ffffff;
      color: #111111;
      outline: none;
    }

    .controls input {
      flex: 1 1 220px;
    }

    .controls select {
      flex: 0 1 170px;
    }

    .controls input:focus,
    .controls select:focus {
      border-color: #999999;
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    @media (min-width: 640px) {
      .movie-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (min-width: 1024px) {
      .movie-grid { grid-template-columns: repeat(4, 1fr); }
    }

    .movie-card {
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      overflow: hidden;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 1px 3px rgba(17, 17, 17, 0.08), 0 1px 2px rgba(17, 17, 17, 0.06);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .movie-card:hover,
    .movie-card:focus {
      border-color: #111111;
      box-shadow: 0 4px 10px rgba(17, 17, 17, 0.14), 0 1px 3px rgba(17, 17, 17, 0.08);
      outline: none;
    }

    .movie-card img {
      display: block;
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      background: #f2f2f2;
    }

    .card-info {
      padding: 10px 12px 12px;
    }

    .card-title {
      font-size: 14px;
      font-weight: bold;
      margin: 0 0 4px;
    }

    .card-meta {
      font-size: 12.5px;
      color: #666666;
      margin: 0 0 6px;
    }

    .card-rating {
      font-size: 12.5px;
      color: #111111;
    }

    .no-results {
      display: none;
      padding: 40px 0;
      text-align: center;
      color: #666666;
      font-size: 14px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(17, 17, 17, 0.55);
      padding: 20px;
      overflow-y: auto;
      z-index: 10;
    }

    .modal.open {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-box {
      background: #ffffff;
      border-radius: 10px;
      width: 100%;
      max-width: 560px;
      padding: 22px;
      position: relative;
    }

    .modal-box .close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 30px;
      height: 30px;
      font-size: 16px;
      line-height: 1;
      border: 1px solid #dcdcdc;
      border-radius: 6px;
      background: #ffffff;
      color: #111111;
      cursor: pointer;
    }

    .modal-box .close-btn:hover {
      border-color: #111111;
    }

    .modal-content {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    .modal-content img {
      width: 160px;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      border-radius: 6px;
      background: #f2f2f2;
    }

    .modal-text {
      flex: 1 1 240px;
    }

    .modal-text h2 {
      font-size: 20px;
      margin: 0 0 8px;
      padding-right: 30px;
    }

    .modal-text .modal-meta {
      font-size: 13px;
      color: #666666;
      margin: 0 0 12px;
    }

    .modal-text .modal-description {
      font-size: 14px;
      color: #333333;
      margin: 0;
    }

    footer {
      border-top: 1px solid #e5e5e5;
      padding: 20px;
      text-align: center;
      font-size: 13px;
      color: #666666;
    }
  </style>

  </main>

    <div class="modal-box">

      <div class="modal-content">

        <div class="modal-text">

          <p class="modal-meta" id="modal-meta"></p>
          <p class="modal-description" id="modal-description"></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const jsonText = document.getElementById('movie-data').textContent;
    const movies = JSON.parse(jsonText);

    const grid = document.getElementById('movie-grid');
    const searchInput = document.getElementById('search-input');
    const genreSelect = document.getElementById('genre-select');
    const noResults = document.getElementById('no-results');
    const modal = document.getElementById('modal');
    const modalPoster = document.getElementById('modal-poster');
    const modalTitle = document.getElementById('modal-title');
    const modalMeta = document.getElementById('modal-meta');
    const modalDescription = document.getElementById('modal-description');

    function placeholderImage(title) {
      const safeTitle = String(title).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450">' +
        '<rect width="300" height="450" fill="#f2f2f2" stroke="#dcdcdc"/>' +
        '<text x="150" y="215" text-anchor="middle" font-family="Arial" font-size="16" fill="#888888">No Poster</text>' +
        '<text x="150" y="240" text-anchor="middle" font-family="Arial" font-size="12" fill="#aaaaaa">' + safeTitle + '</text>' +
        '</svg>';
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }

    function handleImageError(event, title) {
      event.target.onerror = null;
      event.target.src = placeholderImage(title);
    }

    function createMovieCard(movie) {
      const card = document.createElement('div');
      card.className = 'movie-card';
      card.setAttribute('tabindex', '0');

      const poster = document.createElement('img');
      poster.src = movie.poster;
      poster.alt = movie.title + ' poster';
      poster.loading = 'lazy';
      poster.onerror = function (event) { handleImageError(event, movie.title); };

      const info = document.createElement('div');
      info.className = 'card-info';
      info.innerHTML =
        '<p class="card-title"></p>' +
        '<p class="card-meta"></p>' +
        '<p class="card-rating"></p>';

      info.querySelector('.card-title').textContent = movie.title;
      info.querySelector('.card-meta').textContent = movie.year + ' - ' + movie.genre;
      info.querySelector('.card-rating').textContent = 'Rating: ' + movie.rating.toFixed(1);

      card.appendChild(poster);
      card.appendChild(info);

      card.addEventListener('click', function () { openModal(movie); });

      return card;
    }

    function renderMovies() {
      const searchText = searchInput.value.trim().toLowerCase();
      const selectedGenre = genreSelect.value;

      const filtered = movies.filter(function (movie) {
        const matchesTitle = movie.title.toLowerCase().includes(searchText);
        const matchesGenre = (selectedGenre === 'All Genres') || (movie.genre === selectedGenre);
        return matchesTitle && matchesGenre;
      });

      grid.innerHTML = '';
      filtered.forEach(function (movie) {
        grid.appendChild(createMovieCard(movie));
      });

      noResults.style.display = filtered.length === 0 ? 'block' : 'none';
    }

    function openModal(movie) {
      modalPoster.src = movie.poster;
      modalPoster.alt = movie.title + ' poster';
      modalPoster.onerror = function (event) { handleImageError(event, movie.title); };
      modalTitle.textContent = movie.title;
      modalMeta.textContent = movie.year + ' - ' + movie.genre + ' - Rating: ' + movie.rating.toFixed(1);
      modalDescription.textContent = movie.description;
      modal.classList.add('open');
    }

    function closeModal() {
      modal.classList.remove('open');
    }

    document.getElementById('close-modal').addEventListener('click', closeModal);

    modal.addEventListener('click', function (event) {
      if (event.target === modal) {
        closeModal();
      }
    });

    searchInput.addEventListener('input', renderMovies);
    genreSelect.addEventListener('change', renderMovies);

    renderMovies();
  </script>
