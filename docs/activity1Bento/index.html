<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yosh Bento</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

  <style>
    body {
      background-color: #000;
    }

    .card {
      background-color: transparent;
      border: none;
    }

    .card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
    }

    .h-100 img {
      height: 300px;
    }
  </style>
</head>

<body>
  <div class="container-fluid p-3">
    <div class="row">
      <div class="col-6 col-md-2 p-1">
        <div class="card p-1">
          <img src="assets/images/img01.jpg" class="img-fluid" alt="">
        </div>
      </div>
      <div class="col-6 col-md-2 p-1">
        <div class="card p-1">
          <img src="assets/images/img02.webp" class="img-fluid" alt="">

      </div>
      <div class="col-6 col-md-2 p-1">
        <div class="card p-1">
          <img src="assets/images/img03.webp" class="img-fluid" alt="">

      </div>
      <div class="col-6 col-md-3 p-1">
        <div class="card p-1">
          <img src="assets/images/img04.jpg" class="img-fluid" alt="">

      </div>
      <div class="col-12 col-md-3 p-1">

          <img src="assets/images/img05.jpg" class="img-fluid" alt="">

      </div>
    </div>
    <div class="row">

          </div>
          <div class="col-6 p-1">
            <div class="card p-1">
              <img src="assets/images/img08.webp" class="img-fluid" alt="">
            </div>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-5 p-1">
        <div class="card p-1 h-100">
          <img src="assets/images/img09.jpg" class="img-fluid" alt="">

      </div>
      <div class="col-12 col-md-3">

      </div>
    </div>

      <div class="col-12 col-md-4 p-1">
        <div class="card p-1">
          <img src="assets/images/img12.jpg" class="img-fluid" alt="">

      </div>

          <img src="assets/images/img13.jpg" class="img-fluid" alt="">
        </div>
      </div>
      <div class="col-12 col-md-3 p-1">
        <div class="card p-1">
          <img src="assets/images/img14.jpg" class="img-fluid" alt="">
        </div>
      </div>
    </div>
  </div>
